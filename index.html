<style>
:root{--bg:#eef2f6;--paper:#fff;--ink:#16243a;--muted:#5a6b82;--line:#cfd9e6;--accent:#1f5fbf;--on:#fff;
--head:"Space Grotesk",system-ui,sans-serif;--body:"Be Vietnam Pro",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1724;--paper:#172233;--ink:#e4ecf7;--muted:#98a9c1;--line:#2d3d56;--accent:#7fb0ff;--on:#0f1724;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1724;--paper:#172233;--ink:#e4ecf7;--muted:#98a9c1;--line:#2d3d56;--accent:#7fb0ff;--on:#0f1724;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);margin:0}
.wrap{max-width:960px;margin:auto;padding:40px 16px}
h1{font:700 32px/1.2 var(--head);margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 28px;max-width:64ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
a.card{display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:22px 20px;color:var(--ink);text-decoration:none;min-width:0}
a.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,23,36,.08)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a.card h2{font:700 20px var(--head);margin:0;color:var(--accent)}
a.card p{margin:0;color:var(--muted);flex:1}
a.card .go{font:600 14px var(--head);color:var(--accent)}
.foot{color:var(--muted);font-size:13px;margin-top:32px;border-top:1px solid var(--line);padding-top:14px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">
