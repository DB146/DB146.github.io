 của pháp luật đại cương là nghiên cứu đồng thời Nhà nước và Pháp luật trong mối quan hệ qua lại hữu cơ với nhau.", "items": [{"text": "", "answer": true}], "explain": "Pháp luật đại cương nghiên cứu Nhà nước trên phương diện một hiện tượng xã hội — lịch sử gắn liền với Pháp luật, song hành cùng Pháp luật. Không thể nghiên cứu về Pháp luật nếu không xem xét đến Nhà nước."}, {"q": "Pháp luật đại cương không nghiên cứu các hệ thống pháp luật trên thế giới.", "items": [{"text": "", "answer": false}], "explain": "Đối tượng nghiên cứu của pháp luật đại cương bao gồm hệ thống pháp luật thế giới và Việt Nam."}, {"q": "Pháp luật đại cương trả lời câu hỏi: Vai trò của nhà nước hình thành để làm gì?", "items": [{"text": "", "answer": true}], "explain": "Pháp luật đại cương cung cấp những kiến thức tổng thể và khái quát nhất mang tính lý luận về Nhà nước và Pháp luật, trả lời những câu hỏi như nhà nước và pháp luật là gì, chúng khác biệt với các hiện tượng lịch sử - xã hội khác ra sao, xuất hiện từ bao giờ, xuất hiện như thế nào và để làm gì, dưới các hình thức nào, đặc biệt là quá trình tiến hóa của chúng đã, đang và sẽ diễn ra như thế nào."}, {"q": "Pháp luật đại cương là nền tảng, cung cấp những kiến thức cơ sở cho nhiều ngành khoa học pháp lý khác.", "items": [{"text": "", "answer": true}], "explain": "Pháp luật đại cương cung cấp kiến thức cơ sở ngành cho khối ngành khoa học xã hội - nhân văn, kinh tế, luật."}, {"q": "Pháp luật đại cương cung cấp các kiến thức chuyên sâu về những vấn đề liên quan đến Nhà nước và Pháp luật.", "items": [{"text": "", "answer": false}], "explain": "Pháp luật đại cương cung cấp những kiến thức tổng thể và khái quát nhất mang tính lý luận về Nhà nước và Pháp luật."}, {"q": "Pháp luật đại cương cung cấp những kiến thức phổ thông nhằm giáo dục và phổ biến pháp luật cho mọi công dân.", "items": [{"text": "", "answer": true}], "explain": "Môn học Pháp luật đại cương cung cấp những kiến thức pháp luật căn bản cho mỗi công dân. Trong giai đoạn xây dựng Nhà nước pháp quyền hiện nay ở nước ta, mỗi cá nhân, mỗi công dân nói chung, đều cần phải có kiến thức và trình độ pháp luật đại cương mới đáp ứng được những yêu cầu của công cuộc phát triển kinh tế - xã hội."}]}, {"title": "Đúng sai - Chương 2: Những vấn đề lý luận về Nhà nước", "questions": [{"q": "Theo học thuyết tâm lý, Nhà nước ra đời là do nhu cầu của con người trong xã hội khi chưa có nhà nước, muốn cùng nhau lập ra nhà nước để quản lý xã hội.", "items": [{"text": "", "answer": false}], "explain": "Học thuyết này quan niệm sự ra đời của nhà nước bắt nguồn từ nhu cầu tâm lý của người nguyên thủy muốn phụ thuộc vào các thủ lĩnh, giáo sĩ, do đó nhà nước là tổ chức của những siêu nhân có sứ mạng lãnh đạo xã hội do bản chất của con người là yếu đuối, luôn muốn tìm và dựa vào sức mạnh của kẻ khác trong xã hội."}, {"q": "Nhà nước ra đời và tồn tại bất biến, vĩnh cửu.", "items": [{"text": "", "answer": false}], "explain": "Nhà nước là một hiện tượng xã hội - lịch sử, như mọi hiện tượng xã hội - lịch sử khác, có quá trình xuất hiện, tồn tại, phát triển và diệt vong. Nhà nước không phải là một hiện tượng bất biến."}, {"q": "Nguyên nhân trực tiếp của sự ra đời nhà nước là do sự phát sinh và phát triển của chế độ tư hữu về tư liệu sản xuất trong xã hội.", "items": [{"text": "", "answer": false}], "explain": "Nguyên nhân trực tiếp của sự ra đời nhà nước là do sự mâu thuẫn giai cấp không thể điều hòa được, còn chế độ tư hữu là nguồn gốc phát sinh mâu thuẫn giai cấp."}, {"q": "Quyền lực kinh tế đóng vai trò quan trọng nhất bởi nó tạo nên sự lệ thuộc cơ bản nhất giữa giai cấp bị trị đối với giai cấp thống trị.", "items": [{"text": "", "answer": true}], "explain": "Quyền lực kinh tế giữ vai trò quyết định, là cơ sở bảo đảm sự thống trị giai cấp. Quyền lực kinh tế thuộc về giai cấp nắm trong tay tư liệu sản xuất trong xã hội. Với tư liệu sản xuất trong tay, chủ sở hữu có thể bắt người bị bóc lột phải phụ thuộc về mặt kinh tế."}, {"q": "Nhà nước ra đời, tồn tại và phát triển gắn liền với xã hội có giai cấp.", "items": [{"text": "", "answer": true}], "explain": "Nhà nước nào cũng mang tính chất giai cấp, vì nó ra đời, tồn tại, phát triển trong xã hội có giai cấp; là sản phẩm của đấu tranh giai cấp và luôn luôn do một giai cấp (hoặc liên minh giai cấp) nắm giữ."}, {"q": "Tùy vào các kiểu nhà nước khác nhau mà bản chất nhà nước có thể là bản chất giai cấp hoặc bản chất xã hội.", "items": [{"text": "", "answer": false}], "explain": "Mọi nhà nước đều mang đồng thời cả bản chất giai cấp và bản chất xã hội."}, {"q": "Nhà nước mang bản chất giai cấp có nghĩa là nhà nước chỉ thuộc về một giai cấp hoặc một liên minh giai cấp nhất định trong xã hội.", "items": [{"text": "", "answer": true}], "explain": "Nhà nước nào cũng mang tính chất giai cấp, vì nó ra đời, tồn tại, phát triển trong xã hội có giai cấp; là sản phẩm của đấu tranh giai cấp và luôn luôn do một giai cấp (hoặc liên minh giai cấp) nắm giữ."}, {"q": "Nhà nước là một bộ máy cưỡng chế đặc biệt do giai cấp thống trị tổ chức ra và sử dụng để thực hiện sự thống trị đối với xã hội.", "items": [{"text": "", "answer": true}], "explain": "Mỗi nhà nước là một bộ máy bạo lực, công cụ chuyên chính của giai cấp này đối với giai cấp khác."}, {"q": "Không chỉ có nhà nước mới có bộ máy chuyên chế làm nhiệm vụ cưỡng chế, điều đó đã tồn tại từ xã hội cộng sản nguyên thủy.", "items": [{"text": "", "answer": false}], "explain": "Trong xã hội cộng sản nguyên thủy đã có quyền lực nhưng đó là quyền lực xã hội, do tất cả các thành viên xã hội thiết lập và họ tự giác phục tùng, không cần bộ máy cưỡng chế nào cả, do đó nó hoàn toàn hòa nhập với cư dân."}, {"q": "Nhà nước là một bộ máy bạo lực do giai cấp thống trị tổ chức ra để trấn áp các giai cấp đối kháng.", "items": [{"text": "", "answer": true}], "explain": "Giai cấp thống trị sử dụng nhà nước là công cụ thực hiện quyền lực chính trị. Ý chí của giai cấp thống trị thông qua nhà nước trở thành ý chí của nhà nước, ý chí của nhà nước có sức mạnh buộc các giai cấp khác phải tuân theo một “trật tự” do giai cấp thống trị đặt ra, phải phục vụ lợi ích của giai cấp thống trị."}, {"q": "Nhà nước trong xã hội có giai cấp quản lý dân cư theo sự khác biệt về chính trị, tôn giáo, địa vị giai cấp.", "items": [{"text": "", "answer": false}], "explain": "Nhà nước phân chia dân cư theo lãnh thổ và quản lý dân cư theo đơn vị hành chính lãnh thổ."}, {"q": "Trong ba loại quyền lực kinh tế, quyền lực chính trị, quyền lực tư tưởng thì quyền lực chính trị quan trọng nhất vì đó là sự bảo đảm sức mạnh cưỡng chế của giai cấp thống trị và giai cấp bị trị.", "items": [{"text": "", "answer": false}], "explain": "Quyền lực kinh tế giữ vai trò quyết định, là cơ sở bảo đảm sự thống trị giai cấp."}, {"q": "Bản chất xã hội của Nhà nước càng nổi trội so với bản chất giai cấp, thì nhà nước đó càng dân chủ, tiến bộ.", "items": [{"text": "", "answer": true}], "explain": "Bên cạnh chức năng giai cấp, nhà nước giải quyết tất cả các vấn đề khác nảy sinh trong xã hội, nghĩa là phải thực hiện các chức năng xã hội."}, {"q": "Kiểu nhà nước là cách thức tổ chức quyền lực nhà nước và những phương pháp để thực hiện quyền lực nhà nước.", "items": [{"text": "", "answer": false}], "explain": "Cách thức tổ chức quyền lực nhà nước thể hiện thông qua hình thức nhà nước, phương pháp để thực hiện quyền lực nhà nước thể hiện thông qua chế độ chính trị."}, {"q": "Mọi nhà nước đều phải trải qua 4 kiểu nhà nước.", "items": [{"text": "", "answer": false}], "explain": "Không phải mọi nhà nước đều phải trải qua 4 kiểu nhà nước. Ví dụ, Việt Nam không trải qua kiểu nhà nước tư bản chủ nghĩa mà từ chế độ thuộc địa nửa phong kiến lên xây dựng nhà nước dân chủ nhân dân rồi quá độ lên chủ nghĩa xã hội."}, {"q": "Chức năng lập pháp của nhà nước là hoạt động xây dựng pháp luật và tổ chức thực hiện pháp luật.", "items": [{"text": "", "answer": false}], "explain": "Chức năng lập pháp của nhà nước là hoạt động xây dựng pháp luật và ban hành pháp luật."}, {"q": "Chức năng hành pháp của nhà nước là hoạt động nhằm bảo đảm cho pháp luật được thực hiện nghiêm minh và bảo vệ pháp luật trước những hành vi vi phạm.", "items": [{"text": "", "answer": false}], "explain": "Hoạt động bảo vệ pháp luật trước những hành vi vi phạm là chức năng của tư pháp."}, {"q": "Chức năng tư pháp của nhà nước là mặt hoạt động bảo vệ pháp luật.", "items": [{"text": "", "answer": true}], "explain": "Hoạt động bảo vệ pháp luật trước những hành vi vi phạm là chức năng của tư pháp."}, {"q": "Mọi hoạt động của nhà nước nhằm thực hiện nhiệm vụ cơ bản của mình đều được gọi là chức năng của nhà nước.", "items": [{"text": "", "answer": true}], "explain": "Chức năng nhà nước là những mặt hoạt động cơ bản của nhà nước, phù hợp với bản chất, mục đích, nhiệm vụ của nhà nước và được xác định bởi điều kiện kinh tế xã hội của đất nước trong những giai đoạn phát triển của nó."}, {"q": "Giai cấp thống trị đã thông qua nhà nước để xây dựng hệ tư tưởng của giai cấp mình thành hệ tư tưởng thống trị trong xã hội.", "items": [{"text": "", "answer": true}], "explain": "Trong xã hội có giai cấp thì sự thống trị của giai cấp này đối với giai cấp khác được thể hiện trên ba mặt: thống trị về kinh tế, thống trị về chính trị và thống trị về tư tưởng... Bằng nhà nước, pháp luật, giai cấp thống trị thực hiện quyền lực kinh tế và truyền bá, bảo vệ hệ tư tưởng của mình."}, {"q": "Bản chất xã hội của Nhà nước là việc giải quyết tất cả các vấn đề khác nảy sinh trong xã hội.", "items": [{"text": "", "answer": true}], "explain": "Bên cạnh bản chất giai cấp, Nhà nước còn phải giải quyết tất cả các vấn đề khác nảy sinh trong xã hội, nghĩa là phải thực hiện các chức năng xã hội."}, {"q": "Lãnh thổ, dân cư là những yếu tố cấu thành nên một quốc gia.", "items": [{"text": "", "answer": true}], "explain": "Một nhà nước không thể thiếu lãnh thổ và dân cư, quyền lực nhà nước được thực hiện trên toàn lãnh thổ."}, {"q": "Chủ quyền quốc gia là quyền độc lập tự quyết của quốc gia trong lĩnh vực đối nội.", "items": [{"text": "", "answer": false}], "explain": "Chủ quyền quốc gia có nội dung chính trị, được thể hiện quyền độc lập tự quyết về những chính sách đối nội và đối ngoại không phụ thuộc vào các yếu tố bên ngoài."}, {"q": "Chủ quyền quốc gia chỉ là thuộc tính không thể chia cắt của một nhà nước.", "items": [{"text": "", "answer": true}], "explain": "Nhà nước phải có chủ quyền quốc gia, chủ quyền quốc gia thể hiện quyền độc lập tự quyết về những chính sách đối nội và đối ngoại, không phụ thuộc vào nước khác."}, {"q": "Nhà nước là chủ thể duy nhất có quyền ban hành pháp luật và quản lý xã hội bằng pháp luật.", "items": [{"text": "", "answer": true}], "explain": "Pháp luật do nhà nước ban hành có tính bắt buộc chung, mọi công dân đều phải tôn trọng và thực hiện theo pháp luật. Các tổ chức khác trong xã hội chỉ được quyền ban hành các thể lệ, điều lệ, quy chế,… và những thể lệ đó chỉ có hiệu lực điều chỉnh trong nội bộ tổ chức đó."}, {"q": "Nhà nước thu thuế với mục đích duy nhất đảm bảo công bằng xã hội và tiền thuế nhằm đầu tư cho người nghèo trong xã hội.", "items": [{"text": "", "answer": false}], "explain": "Nhà nước đặt ra các loại thuế và tiến hành thu thuế để phục vụ cho nhu cầu về phương diện kinh tế. Thuế là nguồn thu chủ yếu của nhà nước để nuôi dưỡng những người chuyên làm công tác quản lý trong bộ máy nhà nước và xây dựng cơ sở vật chất, kỹ thuật, văn hóa, phúc lợi xã hội,... nhằm thúc đẩy xã hội phát triển."}, {"q": "Thông qua hình thức nhà nước biết được ai là chủ thể nắm quyền lực nhà nước và việc tổ chức thực thi quyền lực Nhà nước như thế nào.", "items": [{"text": "", "answer": true}], "explain": "Hình thức nhà nước là cách tổ chức bộ máy quyền lực nhà nước và phương pháp thực hiện quyền lực nhà nước."}, {"q": "Căn cứ hình thức chính thể Nhà nước, ta biết được Nhà nước đó có dân chủ hay không.", "items": [{"text": "", "answer": false}], "explain": "Muốn biết nhà nước có dân chủ hay không phải thông qua chế độ chính trị để biết cách nhà nước sử dụng các phương pháp, cách thức thực hiện quyền lực nhà nước. Vì thế, chế độ chính trị thể hiện mức độ dân chủ của một nhà nước."}, {"q": "Trong hình thức chính thể quân chủ thì quyền lực tối cao của nhà nước thuộc một tổ chức được nhân dân bầu ra.", "items": [{"text": "", "answer": false}], "explain": "Chính thể quân chủ: Quyền lực cao nhất tập trung toàn bộ hay một phần vào tay người đứng đầu nhà nước theo nguyên tắc thừa kế quyền lực là vua (còn gọi là Quốc vương hay Quân vương hoặc Hoàng đế, Quốc trưởng)."}, {"q": "Chế độ chính trị là toàn bộ các phương pháp, cách thức thực hiện quyền lực nhà nước.", "items": [{"text": "", "answer": true}], "explain": "Chế độ chính trị là toàn bộ các phương pháp, thủ đoạn, cách thức mà giai cấp thống trị sử dụng để thực hiện quyền lực nhà nước của mình."}]}, {"title": "Đúng sai - Chương 3: Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam", "questions": [{"q": "Nhà nước CHXHCN Việt Nam có hình thức cấu trúc nhà nước đơn nhất.", "items": [{"text": "", "answer": true}], "explain": "Nhà nước Việt Nam có chủ quyền duy nhất, có một hệ thống cơ quan nhà nước và một hệ thống pháp luật thống nhất."}, {"q": "Cơ quan nhà nước có nhiệm vụ, quyền hạn mang tính quyền lực nhà nước.", "items": [{"text": "", "answer": true}], "explain": "Cơ quan nhà nước là bộ phận cấu thành của bộ máy nhà nước, được thành lập và có được thẩm quyền theo quy định của pháp luật, nhằm thực hiện nhiệm vụ chiến lược và chức năng của nhà nước."}, {"q": "Bộ máy nhà nước là tập hợp các cơ quan nhà nước từ trung ương đến địa phương.", "items": [{"text": "", "answer": true}], "explain": "Bộ máy nhà nước XHCN là hệ thống các cơ quan nhà nước từ trung ương xuống địa phương, được tổ chức và hoạt động theo những nguyên tắc chung, thống nhất cùng thực hiện nhiệm vụ chiến lược và chức năng của nhà nước XHCN, vì mục tiêu dân giàu, nước mạnh, xã hội công bằng, dân chủ, văn minh."}, {"q": "Cơ quan nhà nước làm việc theo chế độ tập thể trước khi biểu quyết phải thảo luận dân chủ, quyết định theo đa số.", "items": [{"text": "", "answer": true}], "explain": "Cơ quan nhà nước làm việc theo chế độ tập thể trước khi biểu quyết phải thảo luận tập thể và biểu quyết theo đa số."}, {"q": "Quốc hội là cơ quan hành chính nhà nước cao nhất của nước CHXHCN Việt Nam.", "items": [{"text": "", "answer": false}], "explain": "Chính phủ là cơ quan hành chính nhà nước cao nhất của nước CHXHCN Việt Nam."}, {"q": "Quốc hội là cơ quan đại biểu cao nhất của nhân dân.", "items": [{"text": "", "answer": true}], "explain": "Quốc hội là cơ quan đại biểu cao nhất của nhân dân, cơ quan quyền lực nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam."}, {"q": "Quốc hội là cơ quan quyền lực nhà nước cao nhất của nước CHXHCN Việt Nam.", "items": [{"text": "", "answer": true}], "explain": "Quốc hội là cơ quan duy nhất có quyền thông qua, sửa đổi, bổ sung Hiến pháp; thông qua, sửa đổi, bổ sung các đạo luật khác. Quốc hội là cơ quan duy nhất có thẩm quyền quyết định những chính sách cơ bản về đối nội và đối ngoại; nhiệm vụ kinh tế - xã hội, quốc phòng - an ninh của đất nước; xây dựng, củng cố và phát triển bộ máy nhà nước. Quốc hội là cơ quan duy nhất thực hiện quyền giám sát tối cao đối với toàn bộ hoạt động của Nhà nước."}, {"q": "Chủ tịch nước không bắt buộc phải là đại biểu Quốc hội.", "items": [{"text": "", "answer": false}], "explain": "Chủ tịch nước do Quốc hội bầu ra trong số các đại biểu Quốc hội theo sự giới thiệu của Ủy ban Thường vụ Quốc hội."}, {"q": "Chủ tịch nước là người đứng đầu nhà nước, có quyền quyết định các vấn đề quan trọng của đất nước.", "items": [{"text": "", "answer": false}], "explain": "Thẩm quyền quyết định các vấn đề quan trọng của đất nước thuộc về Quốc hội."}, {"q": "Chính phủ là cơ quan đại diện của nhân dân, do cử tri cả nước trực tiếp bầu ra.", "items": [{"text": "", "answer": false}], "explain": "Quốc hội là cơ quan đại biểu cao nhất của nhân dân, cơ quan quyền lực nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam."}, {"q": "Thủ tướng Chính phủ do Chủ tịch nước bổ nhiệm, miễn nhiệm, bãi nhiệm.", "items": [{"text": "", "answer": false}], "explain": "Thủ tướng Chính phủ do Quốc hội bầu, miễn nhiệm, bãi nhiệm theo đề nghị của Chủ tịch nước. Thủ tướng phải là đại biểu Quốc hội. Thủ tướng có quyền ban hành quyết định."}, {"q": "Bộ trưởng, thủ trưởng cơ quan ngang bộ là người đứng đầu chính phủ, do các thành viên chính phủ trực tiếp bầu ra.", "items": [{"text": "", "answer": false}], "explain": "Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ do Thủ tướng đề nghị Quốc hội phê chuẩn về việc bổ nhiệm, miễn nhiệm, cách chức."}, {"q": "Hội đồng nhân dân là cơ quan hành chính nhà nước ở địa phương, do nhân dân địa phương bầu ra.", "items": [{"text": "", "answer": false}], "explain": "Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương, đại diện cho ý chí, nguyện vọng và quyền làm chủ của nhân dân, do nhân dân địa phương bầu ra, chịu trách nhiệm trước nhân dân địa phương và cơ quan nhà nước cấp trên."}, {"q": "Ủy ban nhân dân địa phương có quyền ban hành nghị định và quyết định.", "items": [{"text": "", "answer": false}], "explain": "Ủy ban nhân dân địa phương có quyền ban hành quyết định (văn bản QPPL) và chỉ thị (văn bản hành chính). Nghị định do Chính phủ ban hành."}, {"q": "Tòa án nhân dân và Viện Kiểm sát nhân dân là hai cơ quan duy nhất có chức năng xét xử của nhà nước ta.", "items": [{"text": "", "answer": false}], "explain": "Cơ quan duy nhất đại diện cho nhà nước thực hiện chức năng xét xử là Tòa án nhân dân, Viện Kiểm sát nhân dân thực hiện chức năng công tố và giám sát hoạt động tư pháp."}, {"q": "Đảng Cộng sản Việt Nam là một cơ quan trong bộ máy nhà nước CHXHCN Việt Nam.", "items": [{"text": "", "answer": false}], "explain": "Hệ thống chính trị ở nước ta hiện nay là một chỉnh thể thống nhất, gắn bó hữu cơ bao gồm: Đảng Cộng sản Việt Nam, Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam, Mặt trận Tổ quốc Việt Nam và năm đoàn thể chính trị - xã hội."}]}]</script>
<script>
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const read = (f, d) => { try { return JSON.parse(f()) } catch (e) { return d } };
const norm = s => String(s).trim().toLowerCase().replace(/\s+/g, ' ');
const L = j => String.fromCharCode(65 + j);

const bundled = read(() => $('#bundle').textContent, []);
const stored = read(() => localStorage.getItem('quiz-sets') || '[]', []);
const hidden = read(() => localStorage.getItem('quiz-hidden') || '[]', []);
let sets = [...bundled.filter(b => !hidden.includes(b.title) && !stored.some(s => s.title == b.title)).map(s => ({...s, builtin: 1})), ...stored];
let cur = 0, tocOpen = false, timer = 0;
let pick = new Set(), mode = 'instant', qs = [], submitted = false, showSet = false;

const save = () => { try { localStorage.setItem('quiz-sets', JSON.stringify(sets.filter(s => !s.builtin)));
    localStorage.setItem('quiz-hidden', JSON.stringify(bundled.map(b => b.title).filter(t => !sets.some(s => s.title == t)))) }
  catch (e) { alert('Không lưu được đề vào trình duyệt; đề chỉ có hiệu lực trong lần mở này.') } };

// ---- câu hỏi: hai loại ----
// 'options' + answer "B": chọn 1 đáp án.  'items' [{text, answer: true|false}]: đề bài + các ý đúng/sai.
const isTF = x => Array.isArray(x.q.items);
const key = x => x.q.answer.toUpperCase().charCodeAt(0) - 65;
const fresh = q => Array.isArray(q.items) ? q.items.map(() => null) : null;
// Giữ nguyên thứ tự khi lựa chọn tham chiếu nhau ("Cả B và C", "Tất cả đều đúng") hoặc toàn số, vì trộn sẽ làm sai nghĩa.
const REF = o => /(^|[\s,(])[A-F]([\s,.)]|$)/.test(o) || /đáp án|phương án|đều đúng|đều sai|tất cả|cả ba|cả bốn|nêu trên|\btrên[\s.]*$/i.test(o);
const fixedOrder = q => q.options.some(REF) || q.options.every(o => /^[\d.,\s]+$/.test(o));
const order = q => {
  const o = q.options.map((_, j) => j);
  if (!fixedOrder(q)) for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
  return o;
};
const fresh2 = q => ({sel: fresh(q), ord: Array.isArray(q.items) ? null : order(q)});
const itemShown = (x, k) => mode == 'instant' ? x.sel[k] !== null : submitted;
const answered = x => isTF(x) ? x.sel.every(v => v !== null) : x.sel !== null;
const shown = x => mode == 'instant' ? answered(x) : submitted;
const right = x => isTF(x) ? x.q.items.every((it, k) => x.sel[k] === it.answer) : x.sel === key(x);

// ---- màn hình chọn đề ----
function home() {
  qs = [];
  app.innerHTML = `<h1>Bộ đề</h1>
<p><input type="file" id="file" multiple accept=".html,.htm,.json"></p>
${sets.length ? '' : '<p>Chưa có đề nào. Chọn file đề (.html) ở trên để thêm.</p>'}
${sets.map((s, i) => `<div><label><input type="checkbox" data-set="${i}" ${pick.has(s.title) ? 'checked' : ''}> ${esc(s.title)} (${s.questions.length} câu)</label></div>`).join('')}
<p><button data-act="all">Chọn tất cả</button> <button data-act="del">Xóa</button></p>
<p><label><input type="radio" name="mode" value="instant" ${mode == 'instant' ? 'checked' : ''}> Hiện đáp án ngay</label>
<label><input type="radio" name="mode" value="submit" ${mode == 'submit' ? 'checked' : ''}> Nộp bài mới hiện đáp án</label></p>
<p><button data-act="start">Bắt đầu</button></p>`;
}

async function addFiles(files) {
  for (const f of files) {
    const t = await f.text();
    let d;
    try {
      d = /\.json$/i.test(f.name) ? JSON.parse(t)
        : JSON.parse(new DOMParser().parseFromString(t, 'text/html').getElementById('quiz').textContent);
      if (!d.title || !d.questions.length) throw 0;
    } catch (e) { alert(f.name + ': không phải file đề hợp lệ'); continue }
    sets = sets.filter(s => s.title !== d.title);
    sets.push({title: d.title, questions: d.questions});
  }
  save(); home();
}

// ---- màn hình làm bài ----
function qHTML(x, i) {
  const q = x.q, s = shown(x);
  let body, res = '';
  if (isTF(x)) {
    body = '<div class="tf">' + q.items.map((it, k) => {
      const v = x.sel[k], sh = itemShown(x, k), ok = v === it.answer;
      const lab = (val, t) => `<label class="${sh ? (it.answer === val ? 'ok' : v === val ? 'no' : '') : ''}"><input type="radio" name="q${i}_${k}" data-k="${k}" value="${val ? 1 : 0}" ${v === val ? 'checked' : ''} ${sh ? 'disabled' : ''}> ${t}</label>`;
      return `<div>${it.text ? String.fromCharCode(97 + k) + ') ' + esc(it.text) + '<br>' : ''}${lab(true, 'Đúng')}${lab(false, 'Sai')}</div>`;
    }).join('') + '</div>';
    if (s) {
      const one = q.items.length == 1 && !q.items[0].text, n = q.items.filter((it, k) => x.sel[k] === it.answer).length;
      res = `<div class="${right(x) ? 'ok' : 'no'}">${one ? (right(x) ? 'Đúng' : 'Sai — đáp án: ' + (q.items[0].answer ? 'Đúng' : 'Sai')) : `Đúng ${n}/${q.items.length} ý`}</div>`;
    }
  } else {
    body = x.ord.map((j, p) => [q.options[j], j, p]).map(([o, j, p]) => `<label class="${s ? (j == key(x) ? 'ok' : x.sel === j ? 'no' : '') : ''}"><input type="radio" name="q${i}" value="${j}" ${x.sel === j ? 'checked' : ''} ${s ? 'disabled' : ''}> ${L(p)}. ${esc(o)}</label>`).join('');
    if (s) res = `<div class="${right(x) ? 'ok' : 'no'}">${right(x) ? 'Đúng' : 'Sai — đáp án: ' + L(x.ord.indexOf(key(x)))}</div>`;
  }
  if (s && q.explain) res += `<div>${esc(q.explain)}</div>`;
  return `<section data-i="${i}"><div class="q">${i + 1}. ${esc(q.q)}${showSet ? ` <small>[${esc(x.set)}]</small>` : ''}</div>${body}${res}</section>`;
}

function quiz() {
  showSet = new Set(qs.map(x => x.set)).size > 1;
  const n = qs.length;
  app.innerHTML = `<header><button data-act="home">← Đề</button> <button data-act="reset">Làm lại</button>${mode == 'submit' && !submitted ? ' <button data-act="submit">Nộp bài</button>' : ''} <span id="stat"></span>
<nav><button data-act="prev" ${cur ? '' : 'disabled'}>‹ Trước</button><span>Câu ${cur + 1}/${n}</span><button data-act="toc">Mục lục</button><button data-act="next" ${cur < n - 1 ? '' : 'disabled'}>Sau ›</button></nav>
${tocOpen ? `<div class="toc">${qs.map((x, i) => `<button data-act="go" data-i="${i}" class="${i == cur ? 'cur ' : ''}${shown(x) ? (right(x) ? 'ok' : 'no') : answered(x) ? 'a' : ''}">${i + 1}</button>`).join('')}</div>` : ''}</header>
${qHTML(qs[cur], cur)}`;
  stat();
}

function go(i) { clearTimeout(timer); cur = Math.max(0, Math.min(qs.length - 1, i)); quiz(); scrollTo(0, 0); }

function stat() {
  const n = qs.length, c = qs.filter(x => shown(x) && right(x)).length;
  $('#stat').textContent = submitted ? `Điểm: ${c}/${n} (${Math.round(100 * c / n)}%)`
    : mode == 'instant' ? `Đã làm ${qs.filter(answered).length}/${n} · Đúng ${c}`
    : `Đã trả lời ${qs.filter(answered).length}/${n}`;
}


const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---- sự kiện ----
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a == 'all') { sets.forEach(s => pick.add(s.title)); home(); }
  else if (a == 'del') {
    const n = sets.filter(s => pick.has(s.title)).length;
    if (!n) return alert('Chọn ít nhất một đề để xóa.');
    if (confirm(`Xóa ${n} đề đã chọn khỏi danh sách?`)) { sets = sets.filter(s => !pick.has(s.title)); pick.clear(); save(); home(); }
  }
  else if (a == 'start') {
    const chosen = sets.filter(s => pick.has(s.title));
    if (!chosen.length) return alert('Chọn ít nhất một đề.');
    qs = shuffle(chosen.flatMap(s => s.questions.map(q => ({q, set: s.title, ...fresh2(q)}))));
    submitted = false; cur = 0; tocOpen = false; go(0);
  }
  else if (a == 'home') { clearTimeout(timer); home(); }
  else if (a == 'prev') go(cur - 1);
  else if (a == 'next') go(cur + 1);
  else if (a == 'go') go(+b.dataset.i);
  else if (a == 'toc') { tocOpen = !tocOpen; quiz(); }
  else if (a == 'reset') { qs.forEach(x => Object.assign(x, fresh2(x.q))); shuffle(qs); submitted = false; cur = 0; go(0); }
  else if (a == 'submit') {
    const u = qs.filter(x => !answered(x)).length;
    if (u && !confirm(`Còn ${u} câu chưa trả lời. Vẫn nộp bài?`)) return;
    submitted = true; go(0);
  }
});

app.addEventListener('change', e => {
  const t = e.target;
  if (t.id == 'file') return addFiles(t.files);
  if (t.dataset.set !== undefined) { const s = sets[+t.dataset.set].title; t.checked ? pick.add(s) : pick.delete(s); return; }
  if (t.name == 'mode') { mode = t.value; return; }
  const sec = t.closest('section'); if (!sec) return;
  const i = +sec.dataset.i, x = qs[i];
  if (isTF(x)) { const k = +t.dataset.k; if (mode == 'instant' && x.sel[k] !== null) return; x.sel[k] = t.value == '1'; }
  else { if (mode == 'instant' && x.sel !== null) return; x.sel = +t.value; }
  quiz();
  // instant: hiện đáp án rồi sau 1 giây tự sang câu sau; nộp-bài: trả lời xong (câu một lựa chọn) sang câu sau ngay
  const one = !isTF(x) || x.q.items.length == 1;
  if (i < qs.length - 1 && (mode == 'instant' ? answered(x) : one)) timer = setTimeout(() => cur == i && go(i + 1), mode == 'instant' ? 1000 : 200);
});

document.addEventListener('keydown', e => {
  if (!qs.length || e.target.id == 'file' || !$('nav')) return;
  if (e.key == 'ArrowLeft') go(cur - 1); else if (e.key == 'ArrowRight') go(cur + 1);
});

home();
</script>
