<script id="logic">
/* ===== Đọc số: 3, -1/2, pi/3, sqrt(3), 2*pi ===== */
function num(str){
  const s=String(str).replace(/\s+/g,'').replace(/π/g,'pi').replace(/,/g,'.'); let i=0;
  const eat=t=>s.startsWith(t,i)?(i+=t.length,true):false;
  const fail=()=>{throw new Error('Không đọc được "'+str+'"')};
  function expr(){let v=term();for(;;){if(eat('+'))v+=term();else if(eat('-'))v-=term();else return v}}
  function term(){let v=fac();for(;;){if(eat('*'))v*=fac();else if(eat('/'))v/=fac();else if(/^(pi|sqrt|ln|e)/.test(s.slice(i)))v*=fac();else return v}}
  function fac(){if(eat('-'))return -fac();const v=atom();return eat('^')?v**fac():v}
  function atom(){if(eat('pi'))return Math.PI;if(eat('e'))return Math.E;
    if(eat('ln(')){const v=expr();if(!eat(')'))fail();return Math.log(v)}
    if(eat('sqrt(')){const v=expr();if(!eat(')'))fail();return Math.sqrt(v)}
    if(eat('(')){const v=expr();if(!eat(')'))fail();return v}
    const m=/^\d+(\.\d+)?/.exec(s.slice(i));if(!m)fail();i+=m[0].length;return +m[0]}
  const v=expr(); if(i!==s.length||!isFinite(v))fail(); return v;
}
/* ===== Viết số ra LaTeX ===== */
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function frac(x){const tol=1e-12*Math.max(1,Math.abs(x));for(let d=1;d<=20000;d++){const n=Math.round(x*d);if(Math.abs(x-n/d)<tol)return[n,d]}return null}
// số không viết được thành phân số: giữ 6 chữ số có nghĩa
function dec(x){const[m,e]=x.toPrecision(6).split('e');return e?`${+m}\\cdot 10^{${+e}}`:String(+m)}
function T(x){
  if(Math.abs(x)<1e-12)return'0';
  const f=frac(x); if(f)return f[1]===1?''+f[0]:(f[0]<0?'-':'')+`\\frac{${Math.abs(f[0])}}{${f[1]}}`;
  for(const[z,t] of[[Math.E,'e'],[Math.E**2,'e^{2}'],[Math.E**3,'e^{3}']])if(Math.abs(x-z)<1e-10)return t;
  const n=Math.round(Math.exp(x));if(n>=2&&n<=50&&Math.abs(x-Math.log(n))<1e-12)return`\\ln ${n}`;
  const p=frac(x/Math.PI); if(p){const[n,d]=p,top=(Math.abs(n)===1?'':Math.abs(n))+'\\pi';return(n<0?'-':'')+(d===1?top:`\\frac{${top}}{${d}}`)}
  const q=frac(x*x); if(q){const r=root(Math.abs(x*x));return(x<0?'-':'')+r}
  return dec(x);
}
function sq(n){let k=1;for(let i=2;i*i<=n;i++)while(n%(i*i)===0){n/=i*i;k*=i}return[k,n]}
function root(x){ // căn bậc hai của số hữu tỉ không âm
  const f=frac(x); if(!f)return`\\sqrt{${dec(x)}}`;
  const[k,m]=sq(f[0]*f[1]),g=gcd(k,f[1]),a=k/g,d=f[1]/g;
  const top=m===1?''+a:(a===1?'':a)+`\\sqrt{${m}}`; return d===1?top:`\\frac{${top}}{${d}}`;
}
/* tổng các số hạng [hệ số, biểu thức] */
function S(...terms){
  let out='';
  for(const[c,e] of terms){ if(Math.abs(c)<1e-12)continue;
    const a=Math.abs(c); let body;
    if(!e)body=T(a); else if(Math.abs(a-1)<1e-12)body=e; else body=T(a)+(/^\d/.test(e)?'\\cdot ':'\\,')+e;
    out+=(c<0?'-':out?'+':'')+body; }
  return out||'0';
}
const tidy=z=>z.replace(/\+\s*-/g,'-');
const lin=(a,b)=>S([a,'x'],[b,'']);
const quad=(a,b,c)=>S([a,'x^{2}'],[b,'x'],[c,'']);
const par=s=>/[+-]/.test(s.slice(1))||s[0]==='-'?`\\left(${s}\\right)`:s;
const kx=k=>S([k,'x']);
/* ===== Ngẫu nhiên có mã đề ===== */
let rand=Math.random;
let hideBounds=false;                       // chế độ ẩn cận (bật ở ô Cài đặt)
const HIDE=()=>hideBounds;
function seeded(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=(lo,hi)=>lo+Math.floor(rand()*(hi-lo+1));
const NZ=(lo,hi)=>{let v;do v=R(lo,hi);while(!v);return v};
const pick=a=>a[Math.floor(rand()*a.length)];
function need(ok,msg){if(!ok)throw new Error(msg)}
const isInt=(v,lo,hi)=>Number.isInteger(v)&&v>=lo&&v<=hi;
const order=v=>need(v.p<v.q,'Cần p < q.');
function minQuad(c,d,e,p,q){const Q=x=>c*x*x+d*x+e;let m=Math.min(Q(p),Q(q));const v=-d/(2*c);if(v>p&&v<q)m=Math.min(m,Q(v));return m}

/* ===== Công cụ đa thức, khoảng xác định ===== */
const P1='Phần 1: Đổi biến',P2='Phần 2: Từng phần',P3='Phần 3: Hữu tỉ, lượng giác',P4='Phần 4: Vô tỉ',P5='Phần 5: Tổng hợp',PX='Bổ sung',PS='Tích phân suy rộng';
const ev=(c,x)=>c.reduce((s,a)=>s*x+a,0);                       // hệ số từ bậc cao xuống
const poly=c=>S(...c.map((a,i)=>{const d=c.length-1-i;return[a,d===0?'':d===1?'x':`x^{${d}}`]}));
function polyMin(c,p,q){let m=Math.min(ev(c,p),ev(c,q));for(let i=1;i<2000;i++)m=Math.min(m,ev(c,p+(q-p)*i/2000));return m}
// true nếu [p,q] không chứa điểm nào dạng z0 + jT
const avoid=(p,q,z0,T_)=>{const j=Math.ceil((p-z0)/T_-1e-9);return z0+j*T_>q+1e-9};
const arg=(k,m=0)=>lin(k,m);
const fn=(name,a)=>`\\${name}\\left(${a}\\right)`;
const pw=(b,n)=>n===1?b:`${b}^{${T(n)}}`;
const lnabs=a=>`\\ln\\left|${a}\\right|`;
const over=(top,k)=>Math.abs(k-1)<1e-12?top:`\\frac{${top}}{${T(k)}}`;
const SC=['sin','cos'];

/* ===== Các dạng =====
   gen: bộ số ngẫu nhiên; check: điều kiện; tex: hàm dưới dấu tích phân;
   solve: {F: nguyên hàm TeX, G: nguyên hàm số, note: gợi ý} */
const TYPES=[
/* ---------- Phần 1 ---------- */
{id:'can_n',group:P1,name:'m·u′/ⁿ√u, u là đa thức',keys:['a','b','c','d','n','m','p','q'],
 gen(){return rand()<.5?{a:0,b:R(1,3),c:R(1,5),d:R(1,4),n:R(2,5),m:1,p:0,q:R(1,2)}:{a:R(1,2),b:0,c:R(1,5),d:R(-2,3),n:R(2,5),m:1,p:1,q:2}},
 check(v){order(v);need(isInt(v.n,2,12),'n là số nguyên từ 2 đến 12.');need(v.a||v.b||v.c,'u không được là hằng số.');need(polyMin([v.a,v.b,v.c,v.d],v.p,v.q)>1e-9,'u = ax³+bx²+cx+d phải dương trên [p, q].')},
 tex:v=>{const du=poly([3*v.a,2*v.b,v.c].map(z=>z*v.m)),u=poly([v.a,v.b,v.c,v.d]);return`\\frac{${du}}{${v.n===2?`\\sqrt{${u}}`:`\\sqrt[${v.n}]{${u}}`}}`},
 solve({a,b,c,d,n,m}){const u=poly([a,b,c,d]),e=(n-1)/n;return{note:`Đặt $u=${u}$, tử số là bội của $u'$.`,
  F:S([m/e,`\\left(${u}\\right)^{${T(e)}}`]),G:x=>m/e*ev([a,b,c,d],x)**e}}},

{id:'mu_u',group:P1,name:'m·u′·eᵘ, u là tam thức',keys:['a','b','c','m','p','q'],
 gen(){const p=R(0,1);return{a:R(1,2),b:R(-4,2),c:R(-2,2),m:pick([1,1,1/2,3/2,2]),p,q:p+1}},
 check(v){order(v);need(v.a||v.b,'u không được là hằng số.')},
 tex:v=>`${par(lin(2*v.a*v.m,v.b*v.m))}e^{${poly([v.a,v.b,v.c])}}`,
 solve({a,b,c,m}){const u=poly([a,b,c]);return{note:`Đặt $u=${u}$.`,F:S([m,`e^{${u}}`]),G:x=>m*Math.exp(ev([a,b,c],x))}}},

{id:'hyp',group:P1,name:'tanh(kx+m) hoặc coth(kx+m)',keys:['h','k','m','p','q'],choices:{h:['tanh','coth']},
 gen(){const h=R(0,1),p=R(h,1);return{h,k:R(1,3),m:R(0,2),p,q:pick(['ln(3)','ln(4)','2','ln(5)'])}},
 check(v){order(v);need(v.k!==0,'Cần k ≠ 0.');if(v.h)need((v.k*v.p+v.m)*(v.k*v.q+v.m)>0,'coth không xác định khi kx + m = 0.')},
 tex:v=>fn(v.h?'coth':'tanh',arg(v.k,v.m)),
 solve({h,k,m}){const a=arg(k,m);return{note:h?'Viết $\\coth u=\\dfrac{\\cosh u}{\\sinh u}$ rồi đặt $t=\\sinh u$.':'Viết $\\tanh u=\\dfrac{\\sinh u}{\\cosh u}$ rồi đặt $t=\\cosh u$.',
  F:S([1/k,h?lnabs(fn('sinh',a)):`\\ln\\left(${fn('cosh',a)}\\right)`]),G:x=>Math.log(Math.abs(h?Math.sinh(k*x+m):Math.cosh(k*x+m)))/k}}},

{id:'ln_mu',group:P1,name:'(a·ln x+b)ⁿ/x',keys:['a','b','n','p','q'],
 gen(){return{a:R(1,3),b:NZ(-4,4),n:R(2,4),p:1,q:pick(['e','e^2'])}},
 check(v){order(v);need(v.p>0,'Cần p > 0.');need(v.a!==0,'Cần a ≠ 0.');need(isInt(v.n,0,10),'n là số nguyên từ 0 đến 10.')},
 tex:v=>`\\frac{${pw(`\\left(${S([v.a,'\\ln x'],[v.b,''])}\\right)`,v.n)}}{x}`,
 solve({a,b,n}){const u=S([a,'\\ln x'],[b,'']);return{note:`Đặt $t=${u}$.`,F:S([1/(a*(n+1)),pw(`\\left(${u}\\right)`,n+1)]),G:x=>(a*Math.log(x)+b)**(n+1)/(a*(n+1))}}},

{id:'tan_u',group:P1,name:'sin/cos(k·tan x)/cos²x, hoặc cot x/sin²x',keys:['g','h','k','p','q'],choices:{g:SC,h:['tan x, chia cos²x','cot x, chia sin²x']},
 gen(){const h=R(0,1);return{g:R(0,1),h,k:R(1,4),p:h?'pi/4':'0',q:h?'pi/2':pick(['pi/3','pi/4'])}},
 check(v){order(v);need(v.k!==0,'Cần k ≠ 0.');need(avoid(v.p,v.q,v.h?0:Math.PI/2,Math.PI),'Đoạn [p, q] chứa điểm làm mẫu bằng 0.')},
 tex:v=>`\\frac{${fn(SC[v.g],S([v.k,v.h?'\\cot x':'\\tan x']))}}{${v.h?'\\sin':'\\cos'}^{2}x}`,
 solve({g,h,k}){const t=h?'\\cot x':'\\tan x',s=h?-1:1,c=s*(g?1:-1)/k,out=g?'sin':'cos';return{note:`Đặt $t=${t}$.`,
  F:S([c,fn(out,S([k,t]))]),G:x=>{const u=k*(h?1/Math.tan(x):Math.tan(x));return c*(g?Math.sin(u):Math.cos(u))}}}},

{id:'arc_mu',group:P1,name:'(arcsin x)ⁿ/√(1−x²) hoặc (arctan x)ⁿ/(1+x²)',keys:['h','n','p','q'],choices:{h:['arcsin','arctan']},
 gen(){const h=R(0,1);return{h,n:R(1,4),p:'0',q:h?pick(['1','sqrt(3)']):pick(['1/2','sqrt(3)/2','sqrt(2)/2'])}},
 check(v){order(v);need(isInt(v.n,0,10),'n là số nguyên từ 0 đến 10.');if(!v.h)need(v.p>-1&&v.q<1,'Cần −1 < p < q < 1.')},
 tex:v=>`\\frac{${pw(v.h?'(\\arctan x)':'(\\arcsin x)',v.n)}}{${v.h?'1+x^{2}':'\\sqrt{1-x^{2}}'}}`,
 solve({h,n}){const t=h?'\\arctan x':'\\arcsin x';return{note:`Đặt $t=${t}$.`,F:S([1/(n+1),pw(`(${t})`,n+1)]),G:x=>(h?Math.atan(x):Math.asin(x))**(n+1)/(n+1)}}},

/* ---------- Phần 2 ---------- */
{id:'tp_ln',group:P2,name:'(ax+b)·ln(x+c)',keys:['a','b','c','p','q'],
 gen(){const c=R(0,3),p=c?R(0,1):1;return{a:NZ(-5,5),b:R(-4,4),c,p,q:c?p+R(1,3):pick(['e','3','e^2'])}},
 check(v){order(v);need(v.p+v.c>0,'Cần p + c > 0.')},
 tex:v=>`${par(lin(v.a,v.b))}\\ln ${v.c?par(lin(1,v.c))+'':'x'}`,
 solve({a,b,c}){const t=lin(1,c),tt=c?`\\left(${t}\\right)`:'x',B=b-a*c;return{note:`Từng phần: $u=\\ln ${tt}$.${c?` Nên đổi biến $t=${t}$ trước.`:''}`,
  F:S([a/2,`${tt}^{2}\\ln ${tt}`],[-a/4,`${tt}^{2}`],[B,`${tt}\\ln ${tt}`],[-B,tt]),
  G:x=>{const u=x+c,l=Math.log(u);return a*(u*u*l/2-u*u/4)+B*(u*l-u)}}}},

{id:'tp_exp',group:P2,name:'(ax²+bx+c)·e^(kx)',keys:['a','b','c','k','p','q'],
 gen(){const p=R(-1,0);return{a:R(0,4),b:NZ(-6,6),c:R(-4,6),k:pick([-3,-2,-1,1,2]),p,q:p+R(1,2)}},
 check(v){order(v);need(v.k!==0,'Cần k ≠ 0.')},
 tex:v=>`${par(poly([v.a,v.b,v.c]))}e^{${kx(v.k)}}`,
 solve({a,b,c,k}){const C=[a/k,b/k-2*a/k**2,c/k-b/k**2+2*a/k**3];return{note:'Tích phân từng phần, mỗi lần đặt $u$ là đa thức.',
  F:`${par(poly(C))}e^{${kx(k)}}`,G:x=>ev(C,x)*Math.exp(k*x)}}},

{id:'tp_trig',group:P2,name:'(ax²+bx+c)·sin kx hoặc cos kx',keys:['h','a','b','c','k','p','q'],choices:{h:SC},
 gen(){return{h:R(0,1),a:R(0,3),b:NZ(-5,5),c:R(-4,4),k:pick([1,1,2,3]),p:'0',q:pick(['pi/2','pi'])}},
 check(v){order(v);need(v.k!==0,'Cần k ≠ 0.')},
 tex:v=>`${par(poly([v.a,v.b,v.c]))}${fn(SC[v.h],kx(v.k))}`,
 solve({h,a,b,c,k}){const A=[a/k,b/k,c/k-2*a/k**3],B=[2*a/k**2,b/k**2],s=fn('sin',kx(k)),co=fn('cos',kx(k)),sg=h?1:-1;
  const m=h?s:co,o=h?co:s;
  return{note:'Tích phân từng phần hai lần.',F:`${S([sg,`\\left(${poly(A)}\\right)${m}`])}+\\left(${poly(B)}\\right)${o}`,
  G:x=>sg*ev(A,x)*(h?Math.sin(k*x):Math.cos(k*x))+ev(B,x)*(h?Math.cos(k*x):Math.sin(k*x))}}},

{id:'tp_hyp2',group:P2,name:'(ax+b·cosh x)² hoặc sinh x',keys:['h','a','b','p','q'],choices:{h:['sinh','cosh']},
 gen(){return{h:R(0,1),a:R(1,4),b:pick([-2,-1,1,2]),p:'0',q:pick(['1','2','ln(3)','ln(2)'])}},
 check(v){order(v)},
 tex:v=>`\\left(${S([v.a,'x'],[v.b,`\\${v.h?'cosh':'sinh'} x`])}\\right)^{2}`,
 solve({h,a,b}){const m=h?'cosh':'sinh',o=h?'sinh':'cosh';return{note:`Khai triển bình phương; $x\\${m} x$ tính từng phần, $\\${m}^{2}x$ hạ bậc.`,
  F:S([a*a/3,'x^{3}'],[2*a*b,`\\left(x\\${o} x-\\${m} x\\right)`],[b*b/4,'\\sinh 2x'],[(h?1:-1)*b*b/2,'x']),
  G:x=>a*a*x**3/3+2*a*b*(h?x*Math.sinh(x)-Math.cosh(x):x*Math.cosh(x)-Math.sinh(x))+b*b*(Math.sinh(2*x)/4+(h?x:-x)/2)}}},

{id:'tp_arc',group:P2,name:'arcsin kx hoặc arccos kx',keys:['h','k','p','q'],choices:{h:['arcsin','arccos']},
 gen(){const k=pick([1,2,3,1/2,2/3,3/2]);return{h:R(0,1),k,p:0,q:plain(pick([1/k,1/(2*k)]))}},
 check(v){order(v);need(v.k!==0,'Cần k ≠ 0.');need(Math.abs(v.k*v.p)<=1+1e-12&&Math.abs(v.k*v.q)<=1+1e-12,'Cần |kx| ≤ 1 trên [p, q].')},
 tex:v=>`\\arc${v.h?'cos':'sin'}\\left(${kx(v.k)}\\right)`.replace('\\arcsin','\\arcsin').replace('\\arccos','\\arccos'),
 solve({h,k}){const f=h?'arccos':'arcsin',s=h?-1:1,r=`\\sqrt{${S([1,''],[-k*k,'x^{2}'])}}`;return{note:`Từng phần: $u=\\${f}(${kx(k)})$, $dv=dx$.`,
  F:`x\\${f}\\left(${kx(k)}\\right)${S([s/k,r]).replace(/^(?!-)/,'+')}`,
  G:x=>x*(h?Math.acos:Math.asin)(Math.max(-1,Math.min(1,k*x)))+s*Math.sqrt(Math.max(0,1-k*k*x*x))/k}}},

{id:'tp_lghyp',group:P2,name:'sin/cos(ax)·sinh/cosh(bx)',keys:['g','a','h','b','p','q'],choices:{g:SC,h:['sinh','cosh']},
 gen(){return{g:R(0,1),a:R(1,3),h:R(0,1),b:R(1,2),p:'0',q:pick(['pi/2','pi'])}},
 check(v){order(v);need(v.a!==0&&v.b!==0,'Cần a ≠ 0 và b ≠ 0.')},
 tex:v=>`${fn(SC[v.g],kx(v.a))}${fn(v.h?'cosh':'sinh',kx(v.b))}`,
 solve({g,a,h,b}){const w=a*a+b*b,u=fn(SC[g],kx(a)),du=fn(SC[1-g],kx(a)),vv=fn(h?'cosh':'sinh',kx(b)),dv=fn(h?'sinh':'cosh',kx(b));
  const s=g?-1:1; // u' = s·a·du
  return{note:'Từng phần hai lần rồi giải theo tích phân ban đầu.',F:S([b/w,u+dv],[-s*a/w,du+vv]),
  G:x=>{const U=g?Math.cos(a*x):Math.sin(a*x),dU=g?-a*Math.sin(a*x):a*Math.cos(a*x),V=h?Math.cosh(b*x):Math.sinh(b*x),dV=b*(h?Math.sinh(b*x):Math.cosh(b*x));return(U*dV-dU*V)/w}}}},

{id:'tp_atan',group:P2,name:'arctan(kx)/(mx+n)²',keys:['k','m','n','p','q'],
 gen(){return{k:R(1,3),m:R(1,3),n:R(1,4),p:'0',q:pick(['1','sqrt(3)','2'])}},
 check(v){order(v);need(v.k!==0&&v.m!==0,'Cần k ≠ 0 và m ≠ 0.');need((v.m*v.p+v.n)*(v.m*v.q+v.n)>0,'mx + n phải khác 0 trên [p, q].')},
 tex:v=>`\\frac{\\arctan ${v.k===1?'x':`\\left(${kx(v.k)}\\right)`}}{${pw(`\\left(${lin(v.m,v.n)}\\right)`,2)}}`,
 solve({k,m,n}){const D=m*m+k*k*n*n,at=`\\arctan ${k===1?'x':`\\left(${kx(k)}\\right)`}`;return{note:`Từng phần: $u=${at}$, $dv=\\dfrac{dx}{(${lin(m,n)})^{2}}$, sau đó tách phân thức.`,
  F:S([-1/m,`\\frac{${at}}{${lin(m,n)}}`],[k/D,lnabs(lin(m,n))],[-k/(2*D),`\\ln\\left(${poly([k*k,0,1])}\\right)`],[n*k*k/(m*D),at]),
  G:x=>-Math.atan(k*x)/(m*(m*x+n))+k/D*Math.log(Math.abs(m*x+n))-k/(2*D)*Math.log(1+k*k*x*x)+n*k*k/(m*D)*Math.atan(k*x)}}},

/* ---------- Phần 3 ---------- */
{id:'huuti',group:P3,name:'(ax+b)/(cx²+dx+e), mẫu có 2 nghiệm',keys:['a','b','c','d','e','p','q'],
 gen(){const r=R(-5,-1),s=pick([-6,-5,-4,-3,-2,-1].filter(x=>x!==r)),c=pick([1,1,2]),p=R(0,2);return{a:R(-5,5),b:NZ(-7,7),c,d:-c*(r+s),e:c*r*s,p,q:p+R(1,3)}},
 check(v){order(v);const D=v.d*v.d-4*v.c*v.e;need(v.c!==0&&D>1e-9,'Cần c ≠ 0 và d² − 4ce > 0.');
  for(const s of[-1,1]){const z=(-v.d+s*Math.sqrt(D))/(2*v.c);need(z<v.p-1e-9||z>v.q+1e-9,'Mẫu bằng 0 tại một điểm của [p, q] nên tích phân không xác định thông thường (phân kỳ).')}},
 tex:v=>`\\frac{${lin(v.a,v.b)}}{${poly([v.c,v.d,v.e])}}`,
 solve({a,b,c,d,e}){const D=Math.sqrt(d*d-4*c*e),r=(-d+D)/(2*c),s=(-d-D)/(2*c),A=(a*r+b)/(c*(r-s)),B=(a*s+b)/(c*(s-r)),f=z=>lnabs(lin(1,-z));
  return{note:`Mẫu có nghiệm $x_1=${T(r)}$, $x_2=${T(s)}$. Phân tích thành hai phân thức đơn giản.`,F:S([A,f(r)],[B,f(s)]),G:x=>A*Math.log(Math.abs(x-r))+B*Math.log(Math.abs(x-s))}}},

{id:'votnghiem',group:P3,name:'(ax+b)/(cx²+dx+e), mẫu vô nghiệm',keys:['a','b','c','d','e','p','q'],
 gen(){const h=R(-2,2),k=R(1,3),c=pick([1,1,2,3,4]),p=R(-1,0);return{a:R(-6,6),b:NZ(-6,6),c,d:2*h*c,e:c*(h*h+k*k),p,q:p+R(1,3)}},
 check(v){order(v);need(v.c!==0&&v.d*v.d-4*v.c*v.e<0,'Cần c ≠ 0 và d² − 4ce < 0.')},
 tex:v=>`\\frac{${lin(v.a,v.b)}}{${poly([v.c,v.d,v.e])}}`,
 solve({a,b,c,d,e}){const h=d/(2*c),k=Math.sqrt(e/c-h*h),L=a/(2*c),M=(b-a*h)/(c*k);
  return{note:`Tách tử theo đạo hàm của mẫu, rồi viết mẫu thành $${T(c)}\\left[\\left(${lin(1,h)}\\right)^{2}+${T(k*k)}\\right]$.`,
  F:S([L,`\\ln\\left(${poly([c,d,e])}\\right)`],[M,`\\arctan ${k===1?par(lin(1,h)):`\\frac{${lin(1,h)}}{${T(k)}}`}`]),
  G:x=>L*Math.log(Math.abs(c*x*x+d*x+e))+M*Math.atan((x+h)/k)}}},

{id:'bac3',group:P3,name:'(ux²+vx+w)/(x³+a³)',keys:['u','v','w','a','p','q'],
 gen(){const p=R(0,1);return{u:R(0,4),v:R(0,4),w:R(1,5),a:R(1,4),p,q:p+R(1,2)}},
 check(v){order(v);need(v.a!==0,'Cần a ≠ 0.');need(-v.a<v.p||-v.a>v.q,'x = −a không được nằm trong [p, q].')},
 tex:v=>`\\frac{${poly([v.u,v.v,v.w])}}{x^{3}${S([v.a**3,'']).replace(/^(?!-)/,'+')}}`,
 solve({u,v,w,a}){const A=(u*a*a-v*a+w)/(3*a*a),B=u-A,C=(w-A*a*a)/a,k=Math.abs(a)*Math.sqrt(3)/2,M=(C+B*a/2)/k,q=poly([1,-a,a*a]);
  return{note:`Dùng $x^{3}+a^{3}=(x+a)(x^{2}-ax+a^{2})$ với $a=${T(a)}$ và phân tích thành $\\dfrac{A}{x+a}+\\dfrac{Bx+C}{x^{2}-ax+a^{2}}$.`,
  F:S([A,lnabs(lin(1,a))],[B/2,`\\ln\\left(${q}\\right)`],[M,`\\arctan\\frac{${lin(1,-a/2)}}{${T(k)}}`]),
  G:x=>A*Math.log(Math.abs(x+a))+B/2*Math.log(x*x-a*x+a*a)+M*Math.atan((x-a/2)/k)}}},

{id:'tich_b2',group:P3,name:'1/((ax²+b)(cx²+d))',keys:['a','b','c','d','p','q'],
 gen(){const a=1,b=pick([1,4,9]),c=pick([1,4]);let d=pick([1,4,9,16]);if(a*d===b*c)d=25;return{a,b,c,d,p:0,q:R(1,3)}},
 check(v){order(v);need(v.a>0&&v.b>0&&v.c>0&&v.d>0,'Cần a, b, c, d > 0.');need(Math.abs(v.a*v.d-v.b*v.c)>1e-9,'Cần ad ≠ bc.')},
 tex:v=>`\\frac{1}{\\left(${poly([v.a,0,v.b])}\\right)\\left(${poly([v.c,0,v.d])}\\right)}`,
 solve({a,b,c,d}){const W=a*d-b*c,r=Math.sqrt(a/b),s=Math.sqrt(c/d),at=k=>`\\arctan ${Math.abs(k-1)<1e-12?'x':`\\left(${S([k,'x'])}\\right)`}`;
  return{note:`Tách: $\\dfrac{1}{${T(W)}}\\left(\\dfrac{${T(a)}}{${poly([a,0,b])}}-\\dfrac{${T(c)}}{${poly([c,0,d])}}\\right)$.`,F:S([r/W,at(r)],[-s/W,at(s)]),G:x=>(r*Math.atan(r*x)-s*Math.atan(s*x))/W}}},

{id:'x3x2',group:P3,name:'1/(x³(x²+a))',keys:['a','p','q'],
 gen(){return{a:pick([1,4,9,16]),p:1,q:pick(['2','3','2sqrt(3)'])}},
 check(v){order(v);need(v.a>0,'Cần a > 0.');need(v.p*v.q>0,'Đoạn [p, q] không được chứa 0.')},
 tex:v=>`\\frac{1}{x^{3}\\left(${poly([1,0,v.a])}\\right)}`,
 solve({a}){return{note:`Phân tích thành $${S([1/a,'\\dfrac{1}{x^{3}}'],[-1/(a*a),'\\dfrac{1}{x}'],[1/(a*a),`\\dfrac{x}{${poly([1,0,a])}}`])}$.`,
  F:S([-1/(2*a),'\\frac{1}{x^{2}}'],[-1/a**2,'\\ln|x|'],[1/(2*a*a),`\\ln\\left(${poly([1,0,a])}\\right)`]),
  G:x=>-1/(2*a*x*x)-Math.log(Math.abs(x))/a**2+Math.log(x*x+a)/(2*a*a)}}},

{id:'mot_sin',group:P3,name:'1/sin kx hoặc 1/cos kx',keys:['h','k','p','q'],choices:{h:SC},
 gen(){const h=R(0,1),k=R(1,3);return h?{h,k,p:'0',q:`pi/${3*k}`}:{h,k,p:`pi/${4*k}`,q:`pi/${2*k}`}},
 check(v){order(v);need(v.k!==0,'Cần k ≠ 0.');const K=Math.abs(v.k);need(avoid(v.p,v.q,v.h?Math.PI/(2*K):0,Math.PI/K),'Đoạn [p, q] chứa điểm làm mẫu bằng 0.')},
 tex:v=>`\\frac{1}{\\${SC[v.h]} ${v.k===1?'x':`\\left(${kx(v.k)}\\right)`}}`,
 solve({h,k}){const half=S([k/2,'x']),a=h?`${half}+\\frac{\\pi}{4}`:half;return{note:`Nhân tử và mẫu với $${fn(SC[h],kx(k))}$ rồi đặt $t=${fn(SC[1-h],kx(k))}$.`,
  F:S([1/k,lnabs(`\\tan\\left(${a}\\right)`)]),G:x=>Math.log(Math.abs(Math.tan(k*x/2+(h?Math.PI/4:0))))/k}}},

{id:'canbac2',group:P4,name:'(ax+b)/√(cx²+dx+e)',keys:['a','b','c','d','e','p','q'],
 gen(){const c=pick([1,1,1,4,2,-1]);const p=R(-2,1);return{a:NZ(-5,5),b:R(-6,6),c,d:R(-6,6),e:R(1,12),p,q:p+R(1,3)}},
 check(v){order(v);need(v.c!==0,'Cần c ≠ 0.');const D=v.d*v.d-4*v.c*v.e;need(Math.abs(D)>1e-9,'Biệt thức phải khác 0.');
   need(minQuad(v.c,v.d,v.e,v.p,v.q)>-1e-9,'cx² + dx + e không được âm trên đoạn [p, q].')},
 randomOk:v=>minQuad(v.c,v.d,v.e,v.p,v.q)>1e-9,
 tex:v=>`\\frac{${lin(v.a,v.b)}}{\\sqrt{${quad(v.c,v.d,v.e)}}}`,
 solve({a,b,c,d,e}){const Q=quad(c,d,e),A=a/c,B=b-a*d/(2*c),D=d*d-4*c*e,rc=Math.sqrt(Math.abs(c));
   const J=c>0?`\\ln\\left|${S([2*c,'x'],[d,''],[2*rc,`\\sqrt{${Q}}`])}\\right|`:`\\arcsin\\frac{${lin(-2*c,-d)}}{${root(D)}}`;
   return{note:`Tách tử số theo đạo hàm của mẫu: $${lin(a,b)}=${T(a/(2*c))}\\,(${lin(2*c,d)})${B<0?'':'+'}${T(B)}$, phần còn lại đưa về dạng chính tắc.`,
   F:S([A,`\\sqrt{${Q}}`],[B/rc,J]),
   G:x=>{const s=Math.sqrt(Math.max(0,c*x*x+d*x+e));return A*s+B/rc*(c>0?Math.log(Math.abs(2*c*x+d+2*rc*s)):Math.asin(Math.max(-1,Math.min(1,-(2*c*x+d)/Math.sqrt(D)))))}}}},

{id:'can_cx2',group:P4,name:'√(cx²+e)',keys:['c','e','p','q'],
 gen(){const m=R(1,4),a=R(2,5);return rand()<.5?{c:1,e:a*a,p:0,q:R(2,5)}:{c:-m*m,e:a*a,p:0,q:plain(a/m)}},
 check(v){order(v);need(v.c!==0,'Cần c ≠ 0.');need(minQuad(v.c,0,v.e,v.p,v.q)>-1e-9,'cx² + e không được âm trên [p, q].')},
 tex:v=>`\\sqrt{${v.c<0?S([v.e,''],[v.c,'x^{2}']):poly([v.c,0,v.e])}}`,
 solve({c,e}){const u=v=>v,r=Math.sqrt(Math.abs(c)),Q=c<0?S([e,''],[c,'x^{2}']):poly([c,0,e]);
  const J=c>0?lnabs(`${S([r,'x'])}+\\sqrt{${Q}}`):`\\arcsin\\left(${S([r/Math.sqrt(e),'x'])}\\right)`;
  return{note:c>0?'Tích phân từng phần, hoặc đặt $x$ theo $\\sinh t$.':'Đặt $x$ theo $\\sin t$.',F:S([.5,`x\\sqrt{${Q}}`],[e/(2*r),J]),
  G:x=>{const s=Math.sqrt(Math.max(0,c*x*x+e));return x*s/2+e/(2*r)*(c>0?Math.log(Math.abs(r*x+s)):Math.asin(Math.max(-1,Math.min(1,r*x/Math.sqrt(e)))))}}}},

{id:'nt_can',group:P4,name:'(ax+b)·√(x²+c)',keys:['a','b','c','p','q'],
 gen(){return{a:NZ(-5,5),b:NZ(-5,5),c:pick([1,4,9,16]),p:0,q:R(1,4)}},
 check(v){order(v);need(v.c>0,'Cần c > 0.')},
 tex:v=>`${par(lin(v.a,v.b))}\\sqrt{${poly([1,0,v.c])}}`,
 solve({a,b,c}){const Q=poly([1,0,c]);return{note:`Tách thành hai tích phân: phần chứa $${S([a,'x'])}$ đổi biến $t=${Q}$, phần chứa $${T(b)}$ tích phân từng phần.`,
  F:S([a/3,`\\left(${Q}\\right)^{\\frac{3}{2}}`],[b/2,`x\\sqrt{${Q}}`],[b*c/2,`\\ln\\left(x+\\sqrt{${Q}}\\right)`]),
  G:x=>{const s=Math.sqrt(x*x+c);return a/3*s**3+b*(x*s+c*Math.log(x+s))/2}}}},

{id:'can_x',group:P4,name:'√(a²±x²)/x',keys:['h','a','p','q'],choices:{h:['a² + x²','a² − x²']},
 gen(){const h=R(0,1),a=R(2,5);return h?{h,a,p:plain(a/2),q:a}:{h,a,p:a,q:`${a}sqrt(3)`}},
 check(v){order(v);need(v.a>0,'Cần a > 0.');need(v.p*v.q>0,'Đoạn [p, q] không được chứa 0.');if(v.h)need(v.p>=-v.a&&v.q<=v.a+1e-12,'Cần |x| ≤ a.')},
 tex:v=>`\\frac{\\sqrt{${v.h?S([v.a**2,''],[-1,'x^{2}']):poly([1,0,v.a**2])}}}{x}`,
 solve({h,a}){const r=`\\sqrt{${h?S([a*a,''],[-1,'x^{2}']):poly([1,0,a*a])}}`;return{note:`Đặt $t=${r}$.`,
  F:`${r}${S([-a,lnabs(`\\frac{${T(a)}+${r}}{x}`)])}`,G:x=>{const s=Math.sqrt(Math.max(0,a*a+(h?-x*x:x*x)));return s-a*Math.log(Math.abs((a+s)/x))}}}},

{id:'x_can',group:P4,name:'1/(x·√(a²±x²))',keys:['h','a','p','q'],choices:{h:['a² + x²','a² − x²']},
 gen(){const h=R(0,1),a=R(2,5);return h?{h,a,p:plain(a/2),q:`${a}sqrt(3)/2`}:{h,a,p:a,q:`${a}sqrt(3)`}},
 check(v){order(v);need(v.a>0,'Cần a > 0.');need(v.p*v.q>0,'Đoạn [p, q] không được chứa 0.');if(v.h)need(v.p>-v.a&&v.q<v.a,'Cần |x| < a.')},
 tex:v=>`\\frac{1}{x\\sqrt{${v.h?S([v.a**2,''],[-1,'x^{2}']):poly([1,0,v.a**2])}}}`,
 solve({h,a}){const r=`\\sqrt{${h?S([a*a,''],[-1,'x^{2}']):poly([1,0,a*a])}}`;return{note:`Đặt $t=${r}$.`,

{id:'mu_lg',group:P5,name:'e^(k·sin²x)·sin 2x hoặc cos²x',keys:['h','k','p','q'],choices:{h:['sin²x','cos²x']},
 gen(){return{h:R(0,1),k:pick([-2,-1,1,2,3]),p:'0',q:pick(['pi/2','pi/4','pi/3'])}},

{id:'ln_bp',group:P5,name:'(a·ln x+b)²',keys:['a','b','p','q'],
 gen(){return{a:pick([1,1,2,3]),b:NZ(-4,4),p:1,q:pick(['e','e^2','2'])}},
 check(v){order(v);need(v.p>0,'Cần p > 0.')},
 tex:v=>`\\left(${S([v.a,'\\ln x'],[v.b,''])}\\right)^{2}`,
 solve({a,b}){const C=[a*a,2*a*b-2*a*a,b*b-2*a*b+2*a*a];return{note:'Tích phân từng phần hai lần.',
  F:`x\\left(${S([C[0],'\\ln^{2}x'],[C[1],'\\ln x'],[C[2],''])}\\right)`,G:x=>x*ev(C,Math.log(x))}}},

{id:'bp2',group:P5,name:'1/((x+a)²(x+b)²)',keys:['a','b','p','q'],

{id:'tich_lg',group:P5,name:'sin/cos(mx)·sin/cos(nx)',keys:['g','m','h','n','p','q'],choices:{g:SC,h:SC},
 gen(){const m=R(2,7);return{g:R(0,1),m,h:R(0,1),n:pick([1,2,3,4,5].filter(x=>x!==m)),p:'0',q:pick(['pi/4','pi/3','pi/2','pi/6'])}},
 check(v){order(v);need(Math.abs(v.m)!==Math.abs(v.n),'Cần |m| ≠ |n|.')},
 tex:v=>`${fn(SC[v.g],kx(v.m))}${fn(SC[v.h],kx(v.n))}`,
 solve({g,m,h,n}){const d=m-n,s=m+n;let t; // [hệ số, hàm, tần số] của nguyên hàm
  if(!g&&h)t=[[-1/(2*d),1,d],[-1/(2*s),1,s]];else if(!g&&!h)t=[[1/(2*d),0,d],[-1/(2*s),0,s]];
  else if(g&&h)t=[[1/(2*d),0,d],[1/(2*s),0,s]];else t=[[-1/(2*s),1,s],[1/(2*d),1,d]];
  const norm=t.map(([c,f,k])=>[k<0&&!f?-c:c,f,Math.abs(k)]);
  return{note:'Biến tích thành tổng rồi lấy nguyên hàm từng số hạng.',F:S(...norm.map(([c,f,k])=>[c,fn(SC[f],kx(k))])),
  G:x=>norm.reduce((a,[c,f,k])=>a+c*(f?Math.cos(k*x):Math.sin(k*x)),0)}}},

{id:'tan_n',group:P5,name:'tanⁿx hoặc cotⁿx',keys:['h','n','p','q'],choices:{h:['tan','cot']},
 gen(){const h=R(0,1);return{h,n:R(2,6),p:h?'pi/6':'0',q:h?pick(['pi/3','pi/2']):pick(['pi/4','pi/3'])}},
 check(v){order(v);need(isInt(v.n,1,10),'n là số nguyên từ 1 đến 10.');need(avoid(v.p,v.q,v.h?0:Math.PI/2,Math.PI),'Đoạn [p, q] chứa điểm hàm không xác định.')},
 tex:v=>`${pw(v.h?'\\cot':'\\tan',v.n)} x`,
 solve({h,n}){const f=h?'cot':'tan',terms=[],num_=[];let sg=h?-1:1,k=n;
  while(k>=2){const c=sg/(k-1),e=k-1;terms.push([c,`${pw('\\'+f,e)} x`]);num_.push([c,e]);k-=2;sg=(terms.length%2?-1:1)*(h?-1:1)}
  const last=(Math.floor(n/2)%2?-1:1);
  if(k===0)terms.push([last,'x']);else terms.push([h?last:-last,h?'\\ln|\\sin x|':'\\ln|\\cos x|']);
  return{note:`Dùng công thức hạ bậc với $\\${f}^{2}x=${h?'\\dfrac{1}{\\sin^{2}x}':'\\dfrac{1}{\\cos^{2}x}'}-1$.`,F:S(...terms),
  G:x=>{const t=h?1/Math.tan(x):Math.tan(x);let s=num_.reduce((a,[c,e])=>a+c*t**e,0);
   if(k===0)s+=last*x;else s+=(h?last:-last)*Math.log(Math.abs(h?Math.sin(x):Math.cos(x)));return s}}}},

{id:'abc',group:P5,name:'1/(a·sin x+b·cos x+c)',keys:['a','b','c','p','q'],
 gen(){const r=rand(),q=pick(['pi/3','pi/2','2pi/3']);if(r<.35){const[a,b,c]=pick([[4,-3,5],[3,4,5],[8,15,17],[6,8,10],[12,5,13]]);return{a,b,c,p:'0',q:'pi/2'}}
  if(r<.65){const c=R(2,6);return{a:0,b:NZ(1-c,c-1),c,p:'0',q}}return{a:R(1,3),b:R(1,3),c:R(5,7),p:'0',q}},
 check(v){order(v);need(v.p>-Math.PI&&v.q<Math.PI,'Cần p, q nằm trong (−π, π).');need(v.a||v.b,'a và b không cùng bằng 0.');
  const f=x=>v.a*Math.sin(x)+v.b*Math.cos(x)+v.c;let mn=f(v.p),mx=mn;const pts=[v.q];const ph=Math.atan2(v.a,v.b);
  for(let j=-2;j<=2;j++){const z=ph+j*Math.PI;if(z>v.p&&z<v.q)pts.push(z)}
  for(const z of pts){mn=Math.min(mn,f(z));mx=Math.max(mx,f(z))}need(mn>1e-9||mx<-1e-9,'Mẫu bằng 0 trên [p, q].')},
 tex:v=>`\\frac{1}{${S([v.a,'\\sin x'],[v.b,'\\cos x'],[v.c,''])}}`,
 solve({a,b,c}){const A=c-b,t='\\tan\\frac{x}{2}',tn=x=>Math.tan(x/2);const note0=`Đặt $t=${t}$, tích phân thành $\\displaystyle\\int\\frac{2\\,dt}{${S([A,'t^{2}'],[2*a,'t'],[b+c,''])}}$.`;
  if(Math.abs(A)<1e-12)return{note:note0,F:S([1/a,lnabs(S([a,t],[c,'']))]),G:x=>Math.log(Math.abs(a*tn(x)+c))/a};
  const D=a*a+b*b-c*c,u=S([A,t],[a,'']);
  if(Math.abs(D)<1e-9)return{note:note0+' Mẫu là bình phương đúng.',F:S([-2,`\\frac{1}{${u}}`]),G:x=>-2/(A*tn(x)+a)};
  const r=Math.sqrt(Math.abs(D));
  if(D<0)return{note:note0,F:S([2/r,`\\arctan ${r===1?par(u):`\\frac{${u}}{${T(r)}}`}`]),G:x=>2/r*Math.atan((A*tn(x)+a)/r)};
  return{note:note0,F:S([1/r,lnabs(`\\frac{${S([A,t],[a-r,''])}}{${S([A,t],[a+r,''])}}`)]),G:x=>Math.log(Math.abs((A*tn(x)+a-r)/(A*tn(x)+a+r)))/r}}},

/* ===== Lời giải từng bước =====
   Mỗi bước: [lời dẫn, [các vế bằng nhau], kiểu kiểm tra, biến, hàm đổi x -> biến] */
const It=(g,d='x')=>`\\int{${g}}\\,d${d}`;
const FR=(a,b)=>`\\frac{${a}}{${b}}`;
const W=s=>`\\left(${s}\\right)`;
const say=(text,sides)=>[text,sides];                       // không phải đẳng thức để kiểm tra
const val=(text,sides,v='x',map)=>[text,sides,'val',v,map];  // đồng nhất thức
const intg=(text,sides,v='x',map)=>[text,sides,'int',v,map]; // đẳng thức nguyên hàm
const trim=c=>{while(c.length&&Math.abs(c[0])<1e-12)c=c.slice(1);return c};
const deriv=c=>c.slice(0,-1).map((a,i)=>a*(c.length-1-i));
const times=(g,body)=>g==='1'?body:g.startsWith('\\')||/^[a-z]/.test(g)?g+body:`${g}\\,${body}`;

/* từng phần nhiều lần: ∫ đa thức × (e^kx, sin kx, cos kx) */
function repeatParts(coef,f,k){
  const ker={exp:`e^{${kx(k)}}`,sin:fn('sin',kx(k)),cos:fn('cos',kx(k))};
  const anti={exp:[1/k,'exp'],sin:[-1/k,'cos'],cos:[1/k,'sin']};
  const out=[];let p=trim(coef),j=1;
  while(p.length){
    const[c,g]=anti[f],V=p.map(a=>a*c),dp=trim(deriv(V));
    const lhs=It(`${par(poly(p))}${ker[f]}`),first=`${par(poly(V))}${ker[g]}`;
    out.push(intg(`Lần ${j}: đặt $u=${poly(p)}$, $dv=${ker[f]}\\,dx$, suy ra $v=${S([c,ker[g]])}$.`,
      [lhs,dp.length?`${first}-${It(`${par(poly(dp))}${ker[g]}`)}`:first]));
    p=dp;f=g;j++;
  }
  return out;
}
const STEPS={
can_n({a,b,c,d,n,m}){const u=poly([a,b,c,d]),du=poly([3*a,2*b,c]),e=(n-1)/n;
 return[say('Đặt ẩn phụ:',[`u=${u}`]),say('Vi phân hai vế:',[`du=${W(du)}dx`]),
 intg('Đổi biến rồi dùng công thức luỹ thừa:',[It(S([m,`u^{${T(-1/n)}}`]),'u'),S([m/e,`u^{${T(e)}}`])],'u',x=>ev([a,b,c,d],x))]},
mu_u({a,b,c,m}){const u=poly([a,b,c]);
 return[say('Đặt ẩn phụ:',[`u=${u}`]),say('Vi phân:',[`du=${W(lin(2*a,b))}dx`]),
 intg('Đổi biến:',[It(S([m,'e^{u}']),'u'),S([m,'e^{u}'])],'u',x=>ev([a,b,c],x))]},
hyp({h,k,m}){const a=arg(k,m),s=fn('sinh',a),c=fn('cosh',a),top=h?c:s,bot=h?s:c;
 return[val('Viết lại hàm hyperbolic:',[fn(h?'coth':'tanh',a),FR(top,bot)]),
 say('Đặt ẩn phụ (tử số là đạo hàm của mẫu, sai khác hằng số):',[`t=${bot},\\quad dt=${S([k,top])}\\,dx`]),
 intg('Đổi biến:',[It(S([1/k,FR(1,'t')]),'t'),S([1/k,'\\ln|t|'])],'t',x=>h?Math.sinh(k*x+m):Math.cosh(k*x+m))]},
ln_mu({a,b,n}){const u=S([a,'\\ln x'],[b,''])

const lines=sides_=>{const sides=sides_.map(tidy);return sides.length===1?sides[0]:sides.length===2&&sides[0].length+sides[1].length<90?`${sides[0]}=${sides[1]}`:`\\begin{aligned}${sides[0]}&=${sides.slice(1).join('\\\\&=')}\\end{aligned}`};

/* ===== Dựng một câu từ bộ số dạng chuỗi ===== */
function build(t,raw){
  const v={};for(const k of t.keys)v[k]=num(raw[k]);
  t.check(v);
  // chế độ ẩn cận: đề không in cận nên chỉ còn yêu cầu tìm nguyên hàm
  const hide=HIDE()&&!t.improper;
  const lo=t.lower?T(t.lower(v)):T(v.p), hi=t.upper?t.upper(v):T(v.q);
  const q=hide?`I=\\int{${t.tex(v)}}\\,dx`:`I=\\int_{${lo}}^{${hi}}${t.tex(v)}\\,dx`;
  const s=t.solve(v);
  if(s.F)s.F=tidy(s.F);
  s.note=tidy(s.note);
  const value=t.improper?s.value:s.G(v.q)-s.G(v.p);
  need(!Number.isNaN(value),'Bộ số này làm biểu thức không xác định.');
  return{v,q,s,value,lo,hi,hide};
}
function make(t){
  for(let i=0;i<200;i++){const g=t.gen(),raw={};for(const k of t.keys)raw[k]=typeof g[k]==='string'?g[k]:plain(g[k]);
    try{const b=build(t,raw);if(!t.randomOk||t.randomOk(b.v))return raw}catch(e){}}
  throw new Error('Không sinh được đề cho dạng '+t.name);
}
function plain(x){const f=frac(x);return f?(f[1]===1?''+f[0]:f[0]+'/'+f[1]):''+x}
</script>
<script>
(function(){
const $=id=>document.getElementById(id);
let items=[];
const n6=x=>+x.toFixed(6);

/* ===== Cài đặt được giữ lại sau khi tải lại trang ===== */
const KEY='tpgt1.settings';
const settings=Object.assign({count:40,seed:'',nobounds:false,off:[]},(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}})());
let saveTimer=0;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(settings))}catch(e){}},300)}

/* ===== MathJax: chỉ nạp khi cần và gom mọi lời gọi typeset vào một lượt ===== */
let mj=null,mjQueue=[],mjTimer=0,tryLoad=false;
const mjLive=()=>window.MathJax&&window.MathJax.startup&&window.MathJax.startup.promise&&window.MathJax.typesetPromise;
function loadMathJax(){
  if(mjLive())return ready();
  if(tryLoad)return;tryLoad=true;
  // thẻ script defer trong <head> đang tải; chờ đến khi MathJax thực sự sẵn sàng
  let n=0;const t=setInterval(()=>{
    if(mjLive()){clearInterval(t);ready()}
    else if(++n>120){clearInterval(t);show(mjQueue)}   // MathJax lỗi/không tải được: hiện chữ thường
  },50);
}
function ready(){mj=window.MathJax;const p=mj.startup&&mj.startup.promise;if(!p)return flush();p.then(()=>flush()).catch(()=>{})}
function flush(){clearTimeout(mjTimer);mjTimer=0;if(!mjLive())return;
  const set=[...new Set(mjQueue)];mjQueue=[];
  if(set.length)return mj.typesetPromise(set).then(()=>show(set),()=>show(set));}
// chỉ hiện công thức sau khi MathJax vẽ xong, tránh nháy mã LaTeX thô
function show(els){for(const el of els||[])if(el.querySelectorAll)el.querySelectorAll('.math:not(.mj)').forEach(m=>m.classList.add('mj'))}
function typeset(el){
  mjQueue.push(el);
  if(mjQueue.length>80)mjQueue=mjQueue.slice(-80); // mất MathJax cũng không giữ mãi DOM cũ
  if(!mjLive())loadMathJax();else if(!mj)ready();
  clearTimeout(mjTimer);mjTimer=setTimeout(flush,80)}

/* ===== Lời giải: chỉ dựng khi bấm Đáp án ===== */
function answerHTML(t,b){
  const{s,value,lo,hi,v,hide}=b,list=STEPS[t.id](v);
  const math=x=>`<div class="math">$$${x}$$</div>`;
  let html=`<p class="idea"><b>Hướng làm.</b> ${s.note}</p><ol class="steps">`;
  html+=list.map(([text,sides])=>`<li>${text}${math(lines(sides))}</li>`).join('');
  if(s.F&&!t.improper){
    html+=`<li>Vậy một nguyên hàm theo $x$ là:${math(`F(x)=${s.F}`)}</li>`;
    if(!hide){
      const A=s.G(v.q),B=s.G(v.p);
      const nB=B<0?`\\left(${n6(B)}\\right)`:n6(B);
      html+=`<li>Thay cận theo công thức Newton–Leibniz:${math(`I=F\\left(${hi}\\right)-F\\left(${lo}\\right)\\approx ${n6(A)}-${nB}\\approx ${n6(value)}`)}</li>`;
    }
  }
  html+='</ol>';
  if(value===Infinity)html+='<p>Tích phân <b>phân kỳ</b>.</p>';
  else if(t.improper)html+=`<p>${t.ask?'Tích phân <b>hội tụ</b>.':'Đáp số:'}</p>`+math(`I\\approx ${n6(value)}`);
  else if(hide)html+=`<p>Đáp số: họ nguyên hàm</p>`+math(`I=${s.F}+C`);
  return html;
}

/* ===== Vẽ từng câu ===== */
function render(i){
  const it=items[i],el=$('q'+i);if(!el)return;
  const t=it.t;
  // dùng lại kết quả đã dựng nếu chế độ bất định chưa đổi
  const b=it.cache&&it.cache.hide===hideBounds?it.cache.b:(it.cache={hide:hideBounds,b:build(t,it.raw)}).b;
  el.innerHTML=`<div class="qh">Câu ${i+1}</div>
  <div class="math">${t.ask?'Xét sự hội tụ và tính (nếu hội tụ):':b.hide?'Tích phân bất định:':'Tính:'} $$${b.q}$$</div>
  <div class="row"><button data-a="ans">${it.ans?'Ẩn đáp án':'Đáp án'}</button></div>
  ${it.ans?`<div class="panel">${answerHTML(t,b)}</div>`:''}`;
  el.dataset.done=1;                       // cho content-visibility bỏ vẽ câu ngoài màn hình
  el.classList.remove('mj');               // ẩn công thức cho tới khi MathJax vẽ xong
  typeset(el);
}
function renderShell(){
  $('sheet').innerHTML=items.map((_,i)=>`<section class="q" id="q${i}"></section>`).join('');
  $('all').textContent=items.length&&items.every(x=>x.ans)?'Ẩn đáp án':'Hiện đáp án';
}
// vẽ theo lô để không chặn cuộn trên điện thoại
function paint(from=0,to=items.length){let i=from;const step=()=>{const e=Math.min(to,i+4);while(i<e)render(i++);if(i<to)setTimeout(step,0)};step()}
function renderAll(){renderShell();paint()}

/* ===== Sinh đề theo mã ===== */
function chosenTypes(){const on=new Set(settings.off);return TYPES.filter(t=>!on.has(t.id))}
function generate(seed){
  const chosen=chosenTypes();
  if(!chosen.length){items=[];$('sheet').innerHTML='<p class="q">Hãy chọn ít nhất một dạng ở cột bên rồi bấm Tạo đề.</p>';return}
  const n=Math.max(1,Math.min(50,parseInt($('count').value,10)||40));$('count').value=n;settings.count=n;
  rand=seeded(seed);
  let bag=[];items=[];
  for(let i=0;i<n;i++){
    if(!bag.length){bag=[...chosen];for(let j=bag.length-1;j>0;j--){const k=Math.floor(rand()*(j+1));[bag[j],bag[k]]=[bag[k],bag[j]]}}
    const t=bag.pop();items.push({t,raw:make(t)});
  }
  rand=Math.random;
  renderShell();                           // khung đề hiện ngay, không chờ MathJax
  paint(0,Math.min(items.length,6));       // 6 câu đầu trước, phần còn lại ở lượt sau
  setTimeout(()=>paint(6),0);
}
const fresh=()=>1000+Math.floor(Math.random()*900000);
let last='';
$('gen').onclick=()=>{
  let code=parseInt($('seed').value,10);
  if(Number.isNaN(code))code=fresh();
  $('seed').value=code;settings.seed=code;save();
  // cùng mã, số câu và dạng như lần trước thì giữ nguyên đề đang làm
  const key=[code,$('count').value,chosenTypes().map(t=>t.id).join(',')].join('|');
  if(key===last)return;
  last=key;generate(code);
};

/* ===== Hộp Cài đặt ===== */
const groups={};TYPES.forEach(t=>(groups[t.group]=groups[t.group]||[]).push(t));
const offSet=new Set(settings.off);
$('types').innerHTML=Object.entries(groups).map(([g,l])=>`<fieldset><legend><label class="chk"><input type="checkbox" class="part"> <span>${g}</span></label></legend><div class="opts">${l.map(t=>`<label><input type="checkbox" value="${t.id}"${offSet.has(t.id)?'':' checked'} aria-label="${t.name}"> <span>$\\displaystyle ${SHOW[t.id]}$</span></label>`).join('')}</div></fieldset>`).join('');
let drawn=false;
const pickLabel=()=>{$('pick').textContent=offSet.size?'Chọn hết':'Bỏ hết'};
$('setup').onclick=()=>{$('box').showModal();if(!drawn){drawn=true;typeset($('types'))}};
$('done').onclick=()=>$('box').close();
$('nobounds').onchange=()=>{hideBounds=$('nobounds').checked;settings.nobounds=hideBounds;save();if(items.length)renderAll()};
$('count').onchange=()=>{settings.count=Math.max(1,Math.min(50,parseInt($('count').value,10)||40));$('count').value=settings.count;save()};
$('box').addEventListener('click',e=>{if(e.target===$('box'))$('box').close()});
const boxes=()=>[...document.querySelectorAll('#types input[value]')];
$('types').addEventListener('change',e=>{
  const f=e.target.closest('fieldset'),part=f.querySelector('.part'),own=[...f.querySelectorAll('input[value]')];
  if(e.target===part)own.forEach(x=>x.checked=part.checked);else sync(f);
  own.forEach(x=>{if(x.checked)offSet.delete(x.value);else offSet.add(x.value)});
  settings.off=[...offSet];save();pickLabel();
});
function sync(f){const part=f.querySelector('.part'),own=[...f.querySelectorAll('input[value]')],n=own.filter(x=>x.checked).length;part.checked=n===own.length;part.indeterminate=n>0&&n<own.length}
$('pick').onclick=()=>{
  const on=offSet.size>0;
  boxes().forEach(x=>x.checked=on);
  document.querySelectorAll('#types fieldset').forEach(sync);
  offSet.clear();if(!on)TYPES.forEach(t=>offSet.add(t.id));
  settings.off=[...offSet];save();pickLabel();
};

/* ===== Thao tác trên đề ===== */
$('all').onclick=()=>{const on=!items.every(x=>x.ans);items.forEach(x=>x.ans=on);renderAll()};
$('sheet').addEventListener('click',e=>{
  const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
  const i=+e.target.closest('.q').id.slice(1);items[i].ans=!items[i].ans;
  render(i);
});

/* ===== Khôi phục cài đặt rồi mở đề ===== */
$('count').value=settings.count;
$('nobounds').checked=!!settings.nobounds;hideBounds=!!settings.nobounds;
document.querySelectorAll('#types fieldset').forEach(sync);
pickLabel();
let code=parseInt(settings.seed,10);
$('seed').value=Number.isNaN(code)?'':code;
$('gen').onclick();
})();
</script></script></script>
